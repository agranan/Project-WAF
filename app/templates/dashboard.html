<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple WAF Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        h1 {
            margin-bottom: 6px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
            box-shadow: 0 1px 4px #00000010;
        }

        .stat-card p {
            color: #6b7280;
            margin: 0 0 10px;
        }

        .stat-card h2 {
            margin: 0;
            font-size: 28px;
        }

        .table-container {
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            text-align: left;
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
        }

        .blocked {
            color: #b91c1c;
            background: #fee2e2;
            padding: 5px 9px;
            border-radius: 5px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 25px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        button {
            padding: 9px 15px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status {
            color: #6b7280;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            body {
                padding: 15px;
            }

            .stats {
                flex-direction: column;
            }
        }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .filters select {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            background: white;
            min-width: 180px;
        }

        .chart-container {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 1px 4px #00000010;
        }

        .chart-row {
            display: grid;
            grid-template-columns: 130px 1fr 45px;
            align-items: center;
            gap: 12px;
            margin: 18px 0;
        }

        .chart-track {
            height: 18px;
            background: #e5e7eb;
            border-radius: 5px;
            overflow: hidden;
        }

        .chart-bar {
            height: 100%;
            background: #2563eb;
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        .chart-count {
            text-align: right;
            font-weight: bold;
        }

        .chart-empty {
            color: #6b7280;
            padding: 12px 0;
        }

        @media (max-width: 500px) {
            .chart-row {
                grid-template-columns: 100px 1fr 35px;
                gap: 8px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <h1>Simple WAF</h1>
    <p class="subtitle">Web Application Firewall — Security Monitoring</p>

    <section class="stats">
        <div class="stat-card">
            <p>Total Events Loaded</p>
            <h2 id="total-events">0</h2>
        </div>

        <div class="stat-card">
            <p>Blocked Requests</p>
            <h2 id="blocked-events">0</h2>
        </div>
    </section>

    <section class="chart-container">
        <h3>Attacks by Type</h3>
        <div id="attack-chart"></div>
    </section>

    <section class="table-container">
        <div class="toolbar">
            <h3>Recent Security Events</h3>
            <button onclick="loadEvents()">Refresh</button>
        </div>
        <div class="filters">
            <select id="rule-filter" onchange="renderEvents()">
                <option value="ALL">All attack types</option>
                <option value="SQLI-001">SQL Injection</option>
                <option value="XSS-001">XSS</option>
                <option value="RATE-001">Rate Limit</option>
                <option value="BODY-001">Request Body Too Large</option>
                <option value="BODY-002">Malformed JSON</option>
            </select>

            <select id="action-filter" onchange="renderEvents()">
                <option value="ALL">All actions</option>
                <option value="BLOCK">Blocked</option>
            </select>
        </div>

        <p id="status">Loading events...</p>

        <table>
            <thead>
                <tr>
                    <th>Timestamp (UTC)</th>
                    <th>Source IP</th>
                    <th>Method</th>
                    <th>Endpoint</th>
                    <th>Rule</th>
                    <th>Reason</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="events-table"></tbody>
        </table>
    </section>

    <script>
        let allEvents = [];

        async function loadEvents() {
            const status = document.getElementById("status");

            status.textContent = "Loading events...";

            try {
                const response = await fetch("/api/events?limit=500");

                if (!response.ok) {
                    throw new Error("Failed to fetch events");
                }

                allEvents = await response.json();
                renderEvents();

            } catch (error) {
                status.textContent = "Could not load events. Check the server.";
                console.error(error);
            }
        }
        
        function renderAttackChart(events) {
            const chart = document.getElementById("attack-chart");
            const counts = {
                "SQLI-001": 0,
                "XSS-001": 0,
                "RATE-001": 0,
                "BODY-001": 0,
                "BODY-002": 0
            };

            events.forEach(event => {
                if (Object.prototype.hasOwnProperty.call(counts, event.rule_id)) {
                    counts[event.rule_id]++;
                }
            });

            const labels = {
                "SQLI-001": "SQL Injection",
                "XSS-001": "XSS",
                "RATE-001": "Rate Limit",
                "BODY-001": "Body Too Large",
                "BODY-002": "Malformed JSON"
            };

            const maxCount = Math.max(...Object.values(counts), 1);
            chart.replaceChildren();

            Object.entries(counts).forEach(([rule, count]) => {
                const row = document.createElement("div");
                row.className = "chart-row";

                const label = document.createElement("span");
                label.textContent = labels[rule];

                const track = document.createElement("div");
                track.className = "chart-track";

                const bar = document.createElement("div");
                bar.className = "chart-bar";
                bar.style.width = `${(count / maxCount) * 100}%`;
                track.appendChild(bar);

                const number = document.createElement("span");
                number.className = "chart-count";
                number.textContent = count;

                row.append(label, track, number);
                chart.appendChild(row);
            });
        }

        function renderEvents() {
            const table = document.getElementById("events-table");
            const status = document.getElementById("status");

            const selectedRule = document.getElementById("rule-filter").value;
            const selectedAction = document.getElementById("action-filter").value;
            
            renderAttackChart(allEvents);

            const filteredEvents = allEvents.filter(event => {
                const matchesRule =
                    selectedRule === "ALL" || event.rule_id === selectedRule;

                const matchesAction =
                    selectedAction === "ALL" || event.action === selectedAction;

                return matchesRule && matchesAction;
            });

            document.getElementById("total-events").textContent =
                filteredEvents.length;

            document.getElementById("blocked-events").textContent =
                filteredEvents.filter(event => event.action === "BLOCK").length;

            table.replaceChildren();

            if (filteredEvents.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");

                cell.colSpan = 7;
                cell.className = "empty";
                cell.textContent = "No matching security events.";

                row.appendChild(cell);
                table.appendChild(row);
            } else {
                for (const event of filteredEvents) {
                    const row = document.createElement("tr");

                    const values = [
                        event.timestamp,
                        event.source_ip,
                        event.method,
                        event.path,
                        event.rule_id,
                        event.reason,
                        event.action
                    ];

                    for (let i = 0; i < values.length; i++) {
                        const cell = document.createElement("td");
                        cell.textContent = values[i] ?? "-";

                        if (i === 6 && event.action === "BLOCK") {
                            const badge = document.createElement("span");
                            badge.className = "blocked";
                            badge.textContent = "BLOCK";
                            cell.replaceChildren(badge);
                        }

                        row.appendChild(cell);
                    }

                    table.appendChild(row);
                }
            }

            status.textContent =
                `Showing ${filteredEvents.length} of ${allEvents.length} loaded events.`;
        }

        loadEvents();
    </script>
</body>
</html>
